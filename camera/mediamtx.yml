logLevel: info

# The web container proxies the playlist and segments over shared loopback.
hls: true
hlsAddress: 127.0.0.1:8888
hlsVariant: fmp4

rtsp: false
rtmp: false
webrtc: false
srt: false
moq: false
api: false
metrics: false
pprof: false
playback: false

authMethod: internal
authInternalUsers:
  - user: any
    ips: [127.0.0.1]
    permissions:
      - action: read
        path: classroom

paths:
  classroom:
    # Set MTX_PATHS_CLASSROOM_SOURCE in the private camera.env file.
    source: rtsp://127.0.0.1:9/unconfigured
    sourceOnDemand: true
    rtspTransport: tcp
